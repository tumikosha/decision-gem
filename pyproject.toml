[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-gem"
version = "0.2.0"
description = "Jev-style decision model (noul / choice / score) on a local Gemma, MLX; prompts too"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tumi" }]
requires-python = ">=3.10"
dependencies = ["mlx>=0.32", "mlx-lm>=0.32", "huggingface_hub>=0.30"]
keywords = ["llm", "mlx", "gemma", "classification", "decision-model", "jev", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/tumikosha/decision-gem"
Changelog = "https://github.com/tumikosha/decision-gem/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
decision-gem = "decision_gem.__main__:main"

[tool.setuptools]
packages = ["decision_gem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the model in the local HF cache (Apple silicon, ~15 GiB of memory)"]
addopts = "-m 'not models'"
